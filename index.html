<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roata Norocului - Clasa a X-a MI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Glassmorphism card styles */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Wheel Outer Shadow Glow */
        .wheel-glow {
            filter: drop-shadow(0 0 35px rgba(59, 130, 246, 0.25));
        }

        /* Modal bounce animation */
        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-modal {
            animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 overflow-x-hidden">

    <!-- Header Section -->
    <header class="w-full max-w-2xl text-center pt-2 pb-4">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 uppercase">
            Clasa a X-a MI
        </h1>
    </header>

    <!-- Main Interactive Area -->
    <main class="flex flex-col items-center justify-center w-full max-w-xl flex-1 relative my-auto">
        
        <!-- Wheel Container -->
        <div class="relative w-full max-w-[420px] sm:max-w-[480px] aspect-square wheel-glow flex items-center justify-center">
            
            <!-- Top Pointer / Indicator -->
            <div class="absolute -top-3 left-1/2 -translate-x-1/2 z-30 pointer-events-none filter drop-shadow(0 6px 8px rgba(0,0,0,0.6))">
                <svg width="42" height="48" viewBox="0 0 36 42" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 42L2.41154 15L33.5885 15L18 42Z" fill="#EF4444"/>
                    <path d="M18 36L6 15L30 15L18 36Z" fill="#F87171"/>
                    <circle cx="18" cy="12" r="8" fill="#DC2626"/>
                    <circle cx="18" cy="12" r="4" fill="#FEF2F2"/>
                </svg>
            </div>

            <!-- Canvas Wheel -->
            <canvas id="wheelCanvas" width="900" height="900" class="w-full h-full rounded-full cursor-pointer transition-transform ease-out"></canvas>

            <!-- Center Cap / Hub -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-br from-slate-800 to-slate-950 rounded-full z-20 border-4 border-slate-700 shadow-2xl flex items-center justify-center pointer-events-none">
                <div class="w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-blue-500 shadow-inner border-2 border-slate-900"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="mt-8 flex flex-col items-center gap-3 w-full sm:w-auto">
            <button id="spinBtn" class="w-full sm:w-72 py-4 px-8 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 active:scale-95 text-white font-extrabold text-xl tracking-widest uppercase rounded-2xl shadow-xl hover:shadow-blue-500/30 transition-all duration-200 border border-blue-400/30">
                ÎNVÂRTE ROATA
            </button>
        </div>
    </main>

    <!-- Winner Modal Overlay -->
    <div id="winnerModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <canvas id="confettiCanvas" class="absolute inset-0 pointer-events-none z-10 w-full h-full"></canvas>
        
        <div class="glass-panel p-8 sm:p-10 rounded-3xl max-w-md w-full text-center relative z-20 border border-slate-700/60 shadow-2xl animate-modal flex flex-col items-center">
            
            <div class="w-16 h-16 bg-blue-500/20 text-blue-400 rounded-2xl flex items-center justify-center mb-4 border border-blue-500/30">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
                </svg>
            </div>

            <p class="text-sm font-bold uppercase tracking-widest text-slate-400 mb-2">Elevul selectat este</p>
            
            <h2 id="winnerName" class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-300 via-indigo-200 to-purple-300 mb-8 leading-tight">
                -
            </h2>

            <button id="respinBtn" class="w-full py-3.5 px-6 bg-slate-800 hover:bg-slate-700 active:bg-slate-900 text-white font-bold rounded-xl border border-slate-600 transition-all duration-150 shadow-lg">
                RE-SPIN
            </button>
        </div>
    </div>

    <script>
        // Exact list of 24 students
        const STUDENTS = [
            "AVRĂMUȚ PATRIC LUCA",
            "BRÂNZEI LORENA MARIA",
            "CIOBANU AIDA GABRIELA",
            "CONSTANTIN ADRIANA SARA ELENA",
            "DINCĂ EMILIAN-ANDREI",
            "DRAGOȘ ALEXANDRU-LUCA",
            "DRINCA ANAMARIA-IONELA",
            "DRĂGILĂ SANDRA-ELENA",
            "GACICĂ DENIS IONUȚ",
            "HERAC ROBERT-PETRU",
            "HÎNCU ADAM",
            "IROFTE ANDREEA",
            "IROFTE MARIA",
            "JĂȚA DARIA ANA-MARIA",
            "MĂGUREAN MARIA ELENA",
            "MANOLE FILIP NICUȘOR",
            "MOȘULEȚ MARTA",
            "NERGHES MĂDĂLINA IOANA",
            "NICĂȘIN CLAUDIA-MARIA",
            "PÂRVU DARIA ROBERTA",
            "PEPTAN BIANCA MĂDĂLINA",
            "POP ALESSANDRO",
            "ROMAN ROBERTA MARIA",
            "STOICA SANDRA-ANDREEA"
        ];

        // Rigging Configurations
        const TOP_FAVORITES = [
            "POP ALESSANDRO",
            "GACICĂ DENIS IONUȚ",
            "PÂRVU DARIA ROBERTA",
            "CONSTANTIN ADRIANA SARA ELENA"
        ];

        const EXCLUDED_STUDENTS = [
            "DRAGOȘ ALEXANDRU-LUCA",
            "DRINCA ANAMARIA-IONELA",
            "PEPTAN BIANCA MĂDĂLINA",
            "MOȘULEȚ MARTA"
        ];

        // Pool-ul normal cu cei 20 de elevi (fara cei 4 exclusi)
        const NORMAL_POOL = STUDENTS.filter(name => !EXCLUDED_STUDENTS.includes(name));

        // State Variables
        let currentRotation = 0; // in degrees
        let isSpinning = false;
        let animationReqId = null;

        // Anti-detection initial queue per device/session:
        // We shuffle the order of the top 4 favorites locally for the initial spins.
        let sessionFavoritesQueue = [];

        function initializeSessionQueue() {
            // Fisher-Yates shuffle for initial queue
            const shuffled = [...TOP_FAVORITES];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            sessionFavoritesQueue = shuffled;
        }

        initializeSessionQueue();

        // Canvas & DOM References
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const respinBtn = document.getElementById('respinBtn');
        const winnerModal = document.getElementById('winnerModal');
        const winnerNameEl = document.getElementById('winnerName');
        const confettiCanvas = document.getElementById('confettiCanvas');

        const numSlices = STUDENTS.length;
        const sliceAngle = 360 / numSlices; // 15 degrees per slice

        // Web Audio API Context for sound effects
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTickSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600 + Math.random() * 150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
                
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        }

        function playVictorySound() {
            if (!audioCtx) return;
            try {
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    
                    const startTime = audioCtx.currentTime + (idx * 0.1);
                    gain.gain.setValueAtTime(0, startTime);
                    gain.gain.linearRampToValueAtTime(0.25, startTime + 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.5);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(startTime);
                    osc.stop(startTime + 0.5);
                });
            } catch (e) {}
        }

        // Premium Palette for 24 slices
        const sliceColors = [
            '#1e293b', '#0f172a', '#1e1b4b', '#0f172a',
            '#172554', '#0f172a', '#1e293b', '#0f172a',
            '#311042', '#0f172a', '#1e293b', '#0f172a',
            '#1e1b4b', '#0f172a', '#172554', '#0f172a',
            '#1e293b', '#0f172a', '#311042', '#0f172a',
            '#172554', '#0f172a', '#1e293b', '#0f172a'
        ];

        function drawWheel() {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const outerRadius = width / 2 - 10;

            ctx.clearRect(0, 0, width, height);

            // Draw Slices
            for (let i = 0; i < numSlices; i++) {
                const startAngleRad = (i * sliceAngle) * (Math.PI / 180);
                const endAngleRad = ((i + 1) * sliceAngle) * (Math.PI / 180);

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, outerRadius, startAngleRad, endAngleRad);
                ctx.closePath();

                ctx.fillStyle = sliceColors[i % sliceColors.length];
                ctx.fill();

                // Slice border divider
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.stroke();

                // Draw Text
                ctx.save();
                ctx.translate(centerX, centerY);
                const midAngleRad = startAngleRad + (endAngleRad - startAngleRad) / 2;
                ctx.rotate(midAngleRad);

                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#f1f5f9';
                ctx.font = '700 18px "Plus Jakarta Sans", sans-serif';

                // Truncate long names slightly if needed for wheel aesthetics
                let nameToDisplay = STUDENTS[i];
                if (nameToDisplay.length > 25) {
                    nameToDisplay = nameToDisplay.substring(0, 23) + '...';
                }

                ctx.fillText(nameToDisplay, outerRadius - 35, 0);
                ctx.restore();
            }

            // Outer Ring Styling
            ctx.beginPath();
            ctx.arc(centerX, centerY, outerRadius, 0, 2 * Math.PI);
            ctx.lineWidth = 12;
            ctx.strokeStyle = '#334155';
            ctx.stroke();
        }

        // Initialize wheel render
        drawWheel();

        function pickTargetStudentIndex() {
            // Phase 1: Local Session Queue (for initial spins on each session)
            // Aici se dau favoriții amestecați inițial pentru a ascunde frauda
            if (sessionFavoritesQueue.length > 0) {
                const nextFavoriteName = sessionFavoritesQueue.shift();
                return STUDENTS.indexOf(nextFavoriteName);
            }

            // Phase 2: Distribuție Normală (după ce s-au epuizat favoriții inițiali)
            const rand = Math.random() * 100; // Generează un număr între 0 și 100

            if (rand < 0.001) {
                // 0.001% șansă extrem de rară să pice unul dintre cei 4 excluși (1 la 100.000 rotiri)
                const pick = Math.floor(Math.random() * EXCLUDED_STUDENTS.length);
                return STUDENTS.indexOf(EXCLUDED_STUDENTS[pick]);
            } else {
                // 99.999% șansă să pice oricare alt elev din restul clasei, toți având șanse egale acum
                const pick = Math.floor(Math.random() * NORMAL_POOL.length);
                return STUDENTS.indexOf(NORMAL_POOL[pick]);
            }
        }

        function spin() {
            if (isSpinning) return;
            initAudio();

            isSpinning = true;
            spinBtn.disabled = true;

            const targetIndex = pickTargetStudentIndex();
            const targetStudentName = STUDENTS[targetIndex];

            // Calculations for rotation stop:
            // Pointer is at Top (12 o'clock) = 270 degrees in Canvas standard coordinate system.
            // Slice i center angle = (i + 0.5) * sliceAngle
            // To align slice i center with 270deg:
            // ( (i + 0.5) * sliceAngle + finalAngle ) % 360 = 270
            const sliceCenterAngle = (targetIndex + 0.5) * sliceAngle;
            
            // Calculate target offset angle (0 to 360)
            let desiredAngleOnWheel = (270 - sliceCenterAngle) % 360;
            if (desiredAngleOnWheel < 0) desiredAngleOnWheel += 360;

            // Current modulo rotation
            const currentMod = currentRotation % 360;
            let forwardDiff = desiredAngleOnWheel - currentMod;
            if (forwardDiff < 0) forwardDiff += 360;

            // Add random slight variation inside slice (-40% to +40% of slice width) to look realistic
            const randomInnerSliceOffset = (Math.random() - 0.5) * (sliceAngle * 0.7);

            // Add 8 full rotations (8 * 360 = 2880 deg)
            const totalSpinDegrees = 2880 + forwardDiff + randomInnerSliceOffset;
            const startRotation = currentRotation;
            const endRotation = currentRotation + totalSpinDegrees;

            const duration = 6500; // milliseconds
            let startTime = null;
            let lastTickSliceIndex = -1;

            // Quartic Ease-Out animation curve
            function easeOutQuart(t) {
                return 1 - Math.pow(1 - t, 4);
            }

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easedProgress = easeOutQuart(progress);

                currentRotation = startRotation + (endRotation - startRotation) * easedProgress;

                // Update canvas rotation visually
                canvas.style.transform = `rotate(${currentRotation}deg)`;

                // Calculate current slice under pointer for tick sound effect
                // Pointer is at 270 deg relative to canvas angle
                const currentWheelAngle = (270 - (currentRotation % 360) + 360) % 360;
                const currentSliceIndex = Math.floor(currentWheelAngle / sliceAngle);

                if (currentSliceIndex !== lastTickSliceIndex) {
                    playTickSound();
                    lastTickSliceIndex = currentSliceIndex;
                }

                if (progress < 1) {
                    animationReqId = requestAnimationFrame(animate);
                } else {
                    // Spin finished
                    isSpinning = false;
                    setTimeout(() => {
                        showWinnerModal(targetStudentName);
                    }, 400);
                }
            }

            animationReqId = requestAnimationFrame(animate);
        }

        let confettiParticles = [];
        let confettiAnimationId = null;

        function createConfetti() {
            const ctxC = confettiCanvas.getContext('2d');
            confettiCanvas.width = confettiCanvas.clientWidth;
            confettiCanvas.height = confettiCanvas.clientHeight;

            confettiParticles = [];
            const colors = ['#60a5fa', '#818cf8', '#a78bfa', '#f43f5e', '#fbbf24', '#34d399'];

            for (let i = 0; i < 90; i++) {
                confettiParticles.push({
                    x: confettiCanvas.width / 2,
                    y: confettiCanvas.height / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.7) * 18,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10,
                    gravity: 0.35,
                    opacity: 1
                });
            }

            function renderConfetti() {
                ctxC.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                let alive = false;

                confettiParticles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += p.gravity;
                    p.rotation += p.vRot;
                    p.opacity -= 0.008;

                    if (p.opacity > 0) {
                        alive = true;
                        ctxC.save();
                        ctxC.translate(p.x, p.y);
                        ctxC.rotate((p.rotation * Math.PI) / 180);
                        ctxC.globalAlpha = Math.max(p.opacity, 0);
                        ctxC.fillStyle = p.color;
                        ctxC.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                        ctxC.restore();
                    }
                });

                if (alive) {
                    confettiAnimationId = requestAnimationFrame(renderConfetti);
                }
            }

            if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
            renderConfetti();
        }

        function showWinnerModal(name) {
            playVictorySound();
            winnerNameEl.textContent = name;
            winnerModal.classList.remove('hidden');
            createConfetti();
        }

        function hideWinnerModal() {
            winnerModal.classList.add('hidden');
            spinBtn.disabled = false;
        }

        // Event Listeners
        spinBtn.addEventListener('click', spin);
        respinBtn.addEventListener('click', hideWinnerModal);

        // Window Resize Handling for Confetti Canvas
        window.addEventListener('resize', () => {
            if (!winnerModal.classList.contains('hidden')) {
                confettiCanvas.width = confettiCanvas.clientWidth;
                confettiCanvas.height = confettiCanvas.clientHeight;
            }
        });
    </script>
</body>
</html>
